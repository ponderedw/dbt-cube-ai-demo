name: 'demo'
version: '1.0.0'
profile: 'demo'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]
docs-paths: ["docs"]

clean-targets:
  - "target"
  - "dbt_packages"

models:
  demo:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: view
      +schema: intermediate
    marts:
      core:
        +materialized: table
        +schema: marts
      finance:
        +materialized: table
        +schema: marts
      academic:
        +materialized: table
        +schema: marts
      metrics:
        +materialized: table
        +schema: marts

vars:
  current_semester: "'Fall 2024'"
  academic_year: "'2024-2025'"
