version: "3.8"

services:
  chat_ui:
    image: pondered/cube-chat-ui:latest
    env_file: .env
    ports:
      - "8501:8501"
    environment:
      STREAMLIT_SERVER_HEADLESS: "true"
      STREAMLIT_SERVER_ENABLE_CORS: "false"
      STREAMLIT_SERVER_ENABLE_XSRF_PROTECTION: "false"
    depends_on:
      - fastapi
    restart: always
