version: "3.8"

volumes:
  milvus-data:

services:
  milvus:
    image: milvusdb/milvus:v2.4.6
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_USE_EMBED: "true"
      ETCD_DATA_DIR: /var/lib/milvus/etcd
      COMMON_STORAGETYPE: local
    volumes:
      - milvus-data:/var/lib/milvus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 3
    ports:
      - "19530:19530"
    restart: always

  attu:
    image: zilliz/attu:v2.4
    environment:
      MILVUS_URL: milvus:19530
    ports:
      - "8003:3000"
    depends_on:
      milvus:
        condition: service_healthy
    restart: always

  fastapi:
    image: pondered/cube-rag-api:latest
    env_file: .env
    ports:
      - "8081:8080"
    environment:
      CUBE_OUTPUT_PATH: /workspace/cube_output
    volumes:
      - ./cube_output:/workspace/cube_output:ro
    depends_on:
      milvus:
        condition: service_healthy
      cube_api:
        condition: service_started
    restart: always
